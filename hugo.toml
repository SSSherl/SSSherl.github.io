baseURL = "https://sssherl.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "Sherl 的博客"
theme = "PaperMod"
pagination.pagerSize = 10
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  description = "LLM / Agent / RAG 的工程笔记"
  displayLastMod = true

  [params.homeInfoParams]
    Title = "你好，我是 Sherl"
    Content = "LLM 应用、Agent 工程、RAG 与小模型训练的学习笔记。读源码、做项目、写清楚为什么。"

  [params.footer]
    text = "仅供学习交流 · 转载请署名"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/SSSherl"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 30

[markup.highlight]
  # PaperMod 自带 chroma 色板（noClasses=false 时生效），style 项由主题内置样式接管
  lineNos = false
  codeFences = true
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true
  title = true
